<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面文件索引 - Jay</title>
<style>
  :root {
    --bg: #0e0e12;
    --panel: #18181e;
    --panel-2: #1f1f28;
    --border: #2a2a36;
    --border-light: #363646;
    --ink: #eaeaef;
    --ink-secondary: #b8b8c8;
    --mute: #7a7a8c;
    --folder: #f0c95a;
    --folder-bg: rgba(240, 201, 90, 0.12);
    --file: #7adfff;
    --hidden: #555;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --accent-glow: rgba(59, 130, 246, 0.15);
    --selected: #282e3e;
    --hover-bg: rgba(40, 46, 62, 0.5);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow: 0 2px 8px rgba(0,0,0,0.35);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.45);
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-slow: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "SF Pro Text", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  /* ── Header ── */
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    border-radius: 0 0 var(--radius) var(--radius);
    box-shadow: var(--shadow-sm);
    position: relative;
    z-index: 2;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--ink) 60%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header .meta {
    font-size: 12px;
    color: var(--mute);
    letter-spacing: 0.01em;
  }
  /* ── Controls Bar ── */
  .controls {
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    box-shadow: var(--shadow-sm);
    position: relative;
    z-index: 1;
  }
  .search-wrapper {
    position: relative;
    flex: 1;
    min-width: 180px;
    max-width: 400px;
  }
  .search-wrapper::before {
    content: '🔍';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    pointer-events: none;
    opacity: 0.45;
    z-index: 1;
  }
  .search-wrapper input[type=text] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 7px 10px 7px 32px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    width: 100%;
    transition: var(--transition);
  }
  .search-wrapper input[type=text]::placeholder {
    color: var(--mute);
    opacity: 0.7;
  }
  .search-wrapper input[type=text]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  /* ── Buttons ── */
  button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--ink-secondary);
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  button:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
    background: var(--accent-glow);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  button:active {
    transform: translateY(0);
  }
  /* ── Tree Container ── */
  .tree-container {
    flex: 1;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 16px 24px;
    font-family: -apple-system, "PingFang SC", sans-serif;
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 80px);
  }
  .tree-inner {
    min-width: max-content;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── Node Rows ── */
  .node { user-select: text; }
  .node-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    line-height: 1.6;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--transition);
  }
  .node-row:hover {
    background: var(--hover-bg);
  }
  .toggle {
    width: 16px;
    flex: 0 0 16px;
    text-align: center;
    color: var(--mute);
    user-select: none;
    font-size: 9px;
  }
  .icon {
    flex: 0 0 20px;
    text-align: center;
    font-size: 14px;
    line-height: 1;
  }
  .icon.folder {
    color: var(--folder);
    filter: drop-shadow(0 1px 2px rgba(240, 201, 90, 0.3));
  }
  .icon.file     { color: var(--file); }
  .icon.file-pdf   { color: #f4726b; }
  .icon.file-doc   { color: #60a5fa; }
  .icon.file-xls   { color: #34d399; }
  .icon.file-img   { color: #f59e0b; }
  .icon.file-zip   { color: #a78bfa; }
  .icon.file-code  { color: #f0c95a; }
  .icon.file-video { color: #fb7185; }
  .icon.file-audio { color: #f59e0b; }
  .icon.hidden     { color: var(--hidden); }
  .label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 400;
  }
  .size {
    color: var(--mute);
    font-size: 11px;
    flex: 0 0 auto;
    padding: 2px 8px;
    margin-left: 8px;
    font-variant-numeric: tabular-nums;
    background: var(--panel-2);
    border-radius: var(--radius-xs);
    border: 1px solid var(--border-light);
  }
  /* ── Children (animated expand/collapse) ── */
  .children {
    margin-left: 20px;
    border-left: 1px solid var(--border-light);
    padding-left: 8px;
    overflow: hidden;
    transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.25s ease,
                padding 0.2s ease;
    max-height: 20000px;
    opacity: 1;
  }
  .children.collapsed {
    max-height: 0;
    opacity: 0;
    padding: 0 0 0 8px;
  }
  .search-hl {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #0e0e12;
    padding: 0 3px;
    border-radius: 3px;
    font-weight: 600;
  }
  .empty {
    color: var(--mute);
    font-size: 13px;
    padding: 32px 20px;
    text-align: center;
    letter-spacing: 0.02em;
  }
  /* ── Footer ── */
  footer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 8px 24px;
    color: var(--mute);
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    border-radius: var(--radius) var(--radius) 0 0;
    box-shadow: var(--shadow-sm);
  }
  /* ── Toast ── */
  .path-toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--panel-2);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border-light);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    opacity: 0;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    max-width: 80%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .path-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  /* ── Custom Scrollbar ── */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--border-light);
  }
  /* ── Touch / Mobile ── */
  @media (hover: none) and (pointer: coarse) {
    .node-row { padding: 10px 8px; font-size: 15px; }
    .controls { padding: 14px 20px; }
    button { padding: 10px 18px; font-size: 14px; }
    .search-wrapper { max-width: 100%; }
    .search-wrapper input[type=text] { padding: 10px 12px 10px 36px; font-size: 15px; }
  }
</style>

<script>
let treeData = null;

function fmtSize(bytes) {
  if (bytes == null) return '';
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + 'KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + 'MB';
  return (bytes/1024/1024/1024).toFixed(1) + 'GB';
}
function countAll(node) {
  if (!node.is_dir) return { f: 1, sd: 0 };
  let r = { f: 0, sd: 1 };
  for (const c of node.children || []) {
    const sub = countAll(c);
    r.f += sub.f; r.sd += sub.sd;
  }
  return r;
}
function renderNode(node, container, isRoot = false) {

    toggle.textContent = '▶';

  }

    app:  ['file-code', '📦'],
  };
  const ft = fileIconMap[ext] || ['file', '📄'];
  icon.className = 'icon ' + (node.is_dir ? 'folder' : ft[0]);
  icon.textContent = node.is_dir ? '📁' : ft[1];
  const label = document.createElement('span');

  label.textContent = node.name;

  const size = document.createElement('span');
  size.className = 'size';
  if (node.is_dir) {
    const c = countAll(node);
    size.textContent = c.f + ' 文件 · ' + c.sd + ' 文件夹';
  } else {
    size.textContent = fmtSize(node.size);
  }
  row.appendChild(toggle);
  row.appendChild(icon);
  row.appendChild(label);
  if (!isRoot) row.appendChild(size);
  const childrenWrap = document.createElement('div');
  childrenWrap.className = 'children collapsed';

    empty.className = 'empty';
    empty.textContent = '(深度已截断)';
    childrenWrap.appendChild(empty);
  }
  toggle.addEventListener('click', e => {
    e.stopPropagation();
    if (!node.is_dir) return;
    if (childrenWrap.classList.contains('collapsed')) {
      childrenWrap.classList.remove('collapsed');

}
function expandAll() {
  document.querySelectorAll('.children').forEach(el => el.classList.remove('collapsed'));
  document.querySelectorAll('.toggle').forEach(el => { if (el.dataset.state !== undefined) el.textContent = '▼'; });
}
function collapseAll() {
  // 折叠所有非 root 的子节点容器
  document.querySelectorAll('.tree-inner .children').forEach(el => {
    el.classList.add('collapsed');
  });
  // 同步所有 toggle 按钮显示为 ▶
  document.querySelectorAll('.toggle').forEach(el => {
    if (el.dataset.state !== undefined) el.textContent = '▶';
  });
  // 但 root (Desktop) 自己保持展开，让用户能看到顶层一级文件夹
  const rootTrees = document.querySelectorAll('.tree-inner > .node');
  rootTrees.forEach(root => {
    const rootChildren = root.querySelector(':scope > .children');
    if (rootChildren) {
      rootChildren.classList.remove('collapsed');
      const rootToggle = root.querySelector(':scope > .node-row > .toggle');
      if (rootToggle && rootToggle.dataset.state !== undefined) rootToggle.textContent = '▼';
    }
  });
}
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2000);
}
function applyFilter(q) {
  q = q.trim().toLowerCase();

    document.querySelectorAll('.node').forEach(n => { n.style.display = ''; });
    document.querySelectorAll('.label').forEach(label => {
      if (label.dataset.origText) {
        label.textContent = label.dataset.origText;
        delete label.dataset.origText;
      }
      label.innerHTML = label.textContent; // 清除可能的 innerHTML 残留
    });
    const empty = document.querySelector('.search-empty');
    if (empty) empty.remove();
    collapseAll();
    updateSearchCount(0);
    return;
  }

  // Phase 1: 重置所有节点可见，恢复标签原始文本
  document.querySelectorAll('.node').forEach(node => { node.style.display = ''; });
  document.querySelectorAll('.label').forEach(label => {
    if (label.dataset.origText) {
      label.textContent = label.dataset.origText;
      delete label.dataset.origText;
    }
    label.innerHTML = label.textContent;
  });
  const oldEmpty = document.querySelector('.search-empty');
  if (oldEmpty) oldEmpty.remove();

  // Phase 2: 标记直接匹配
  let matchCount = 0;
  document.querySelectorAll('.node').forEach(node => {
    const text = node.dataset.searchText || '';
    const match = text.includes(q);
    node.dataset.searchMatch = match ? '1' : '0';
    if (match) matchCount++;

  document.querySelectorAll('.node').forEach(node => {

    const hasDescendantMatch = node.querySelector('.node[data-search-match="1"]') !== null;
    if (directMatch || hasDescendantMatch) {
      node.style.display = '';
      // 展开所有祖先节点
      let p = node.parentElement;
      while (p && !p.classList.contains('tree-inner')) {
        if (p.classList.contains('children')) {
          p.classList.remove('collapsed');
          const toggle = p.previousElementSibling?.querySelector?.('.toggle');
          if (toggle && toggle.dataset.state !== undefined) toggle.textContent = '▼';
        }
        p = p.parentElement;
      }
    } else {
      node.style.display = 'none';
    }
  });

  // Phase 4: 高亮匹配文本
  if (matchCount > 0) {
    document.querySelectorAll('.node[data-search-match="1"]').forEach(node => {
      const label = node.querySelector(':scope > .node-row > .label');
      if (!label) return;
      // 直接在 label 文本中查找匹配位置
      const labelText = label.textContent;
      if (!labelText) return;
      if (!label.dataset.origText) label.dataset.origText = labelText;
      const idx = labelText.toLowerCase().indexOf(q);
      if (idx !== -1) {
        const before = escapeHtml(labelText.slice(0, idx));
        const hl = escapeHtml(labelText.slice(idx, idx + q.length));
        const after = escapeHtml(labelText.slice(idx + q.length));
        label.innerHTML = before + '<span class="search-hl">' + hl + '</span>' + after;
      }
    });
  }

  // Phase 5: 无结果提示
  if (matchCount === 0) {
    const tree = document.getElementById('tree');
    const empty = document.createElement('div');
    empty.className = 'empty search-empty';
    empty.textContent = '🔍 没有匹配 "' + q.trim() + '" 的结果';
    tree.appendChild(empty);
  }
  updateSearchCount(matchCount);
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function updateSearchCount(count) {
  let el = document.getElementById('search-count');
  if (!el) {
    el = document.createElement('span');
    el.id = 'search-count';
    el.style.cssText = 'margin-left:auto;color:var(--accent);font-size:12px';
    document.querySelector('.controls').appendChild(el);
  }
  el.textContent = count > 0 ? '找到 ' + count + ' 个匹配' : '';
}
function load() {
  const data = window.TREE_DATA || [];
  const root = document.getElementById('tree');
  root.innerHTML = '';
  let total = { f: 0, sd: 0 };
  for (const r of data) {
    renderNode(r.tree, root, true);
    const s = countAll(r.tree);
    total.f += s.f; total.sd += s.sd;
  }
  document.getElementById('stat-folders').textContent = total.sd + ' 文件夹';
  document.getElementById('stat-files').textContent = total.f + ' 文件';
  document.getElementById('stat-source').textContent = data.map(t => t.root).join(' · ');
  document.getElementById('update-time').textContent = new Date().toLocaleString('zh-CN');
}
document.getElementById('search').addEventListener('input', e => applyFilter(e.target.value));
document.getElementById('expand-all').addEventListener('click', expandAll);
document.getElementById('collapse-all').addEventListener('click', collapseAll);
document.getElementById('copy-path').addEventListener('click', () => {
  clickToCopy = !clickToCopy;
  const btn = document.getElementById('copy-path');
  btn.textContent = clickToCopy ? '✓ 单击复制已开启' : '点文件/文件夹 → 复制路径';
  btn.style.borderColor = clickToCopy ? 'var(--accent)' : '';
  btn.style.color = clickToCopy ? 'var(--accent)' : '';
  if (clickToCopy) showToast('现在单击任意文件/文件夹名 = 复制完整路径到剪贴板');
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if (e.key === 'Escape') {
    const s = document.getElementById('search');
    s.value = '';
    applyFilter('');
    s.blur();
  }
});
load();
</script>
