<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
/* === 主题:深色(基于记账 PWA v6 调色板) === */
:root[data-theme="dark"] {
  --bg: #12161F; --bg-2: #1A1F2B; --card: #1A1F2B; --border: #2A3142;
  --text: #E8ECF2; --text-dim: #8A93A6; --text-mute: #5A6376;
  --accent: #E8B660; --accent-dim: #B8903F; --accent-on: #12161F;
  --good: #6BBE6B; --warn: #E89B4D; --bad: #E86464;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
  --modal-bg: rgba(0,0,0,0.7);
  --placeholder-from: #2A3142; --placeholder-to: #1A1F2B;
  --img-overlay: rgba(0,0,0,0.75);
  --input-bg: #12161F;
  --rank-1: #FFD700; --rank-2: #C0C0C0; --rank-3: #CD7F32;
  --rank-on: #000;
}
/* === 主题:浅色(暖白底 + 暖橙) === */
:root[data-theme="light"] {
  --bg: #FAF8F3; --bg-2: #F0EBE1; --card: #FFFFFF; --border: #E5DFD3;
  --text: #2A2520; --text-dim: #6E6558; --text-mute: #A8A094;
  --accent: #C08840; --accent-dim: #A87530; --accent-on: #FFFFFF;
  --good: #0E7C3A; --warn: #B86A20; --bad: #C0382B;
  --shadow: 0 2px 8px rgba(80,60,20,0.08);
  --shadow-lg: 0 8px 24px rgba(80,60,20,0.12);
  --modal-bg: rgba(40,30,10,0.45);
  --placeholder-from: #F0EBE1; --placeholder-to: #E5DFD3;
  --img-overlay: rgba(40,30,10,0.65);
  --input-bg: #FAF8F3;
  --rank-1: #E8B660; --rank-2: #B8B8B8; --rank-3: #C08850;
  --rank-on: #FFFFFF;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  padding: 12px 14px 80px; font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s, color .25s;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 4px 14px; border-bottom: 1px solid var(--border); margin-bottom: 14px;
}
header h1 { font-size: 18px; color: var(--accent); font-weight: 700; }
.header-actions { display: flex; gap: 6px; }
.icon-btn {
  background: var(--card); color: var(--text-dim); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: 8px; font-size: 14px; cursor: pointer;
  transition: background-color .2s, color .2s, transform .15s;
}
.icon-btn:hover { background: var(--bg-2); color: var(--text); }
.icon-btn:active { background: var(--accent); color: var(--accent-on); transform: scale(0.95); }

/* Today's plan banner */
.today-banner {
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
  color: var(--accent-on); padding: 12px 14px; border-radius: 12px;
  margin-bottom: 14px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shadow);
}
.today-banner.empty { background: var(--card); color: var(--text-dim); cursor: default; box-shadow: none; }
.today-banner .arrow { font-size: 18px; }

/* Week preview */
.week-preview {
  display: flex; gap: 4px; margin-bottom: 14px; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none;
}
.week-preview::-webkit-scrollbar { display: none; }
.day-cell {
  flex: 1; min-width: 56px; background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 4px; text-align: center; cursor: pointer;
  transition: all 0.15s;
}
.day-cell:active { transform: scale(0.96); }
.day-cell.today { border-color: var(--accent); }
.day-cell .dc-name { font-size: 11px; color: var(--text-dim); }
.day-cell .dc-date { font-size: 14px; font-weight: 700; color: var(--text); margin: 2px 0; }
.day-cell .dc-count {
  display: inline-block; min-width: 18px; padding: 0 5px;
  background: var(--accent); color: var(--accent-on); border-radius: 8px;
  font-size: 10px; font-weight: 700; line-height: 16px;
}
.day-cell .dc-count.zero { background: var(--bg-2); color: var(--text-mute); border: 1px solid var(--border); }

/* Tabs */
.tabs {
  display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 8px 14px; border-radius: 20px; font-size: 13px;
  background: var(--card); color: var(--text-dim); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.2s;
}
.tab.active { background: var(--accent); color: var(--accent-on); border-color: var(--accent); font-weight: 600; }

/* Stats bar */
.stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
.stat-num { font-size: 20px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

.section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: var(--text-dim);
  margin: 18px 4px 10px; text-transform: uppercase; letter-spacing: 0.5px;
}
.section-title .count {
  background: var(--card); padding: 2px 8px; border-radius: 10px;
  font-size: 11px; color: var(--accent); font-weight: 700;
}

.card-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
}
@media (min-width: 640px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .card-grid { grid-template-columns: repeat(4, 1fr); } }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; box-shadow: var(--shadow); cursor: pointer;
  transition: transform 0.15s, border-color 0.2s;
}
.card:active { transform: scale(0.98); }
.card.urgent { border-color: var(--warn); }
.card-img {
  width: 100%; aspect-ratio: 1/1; background: linear-gradient(135deg, var(--placeholder-from) 0%, var(--placeholder-to) 100%);
  display: flex; align-items: center; justify-content: center; position: relative;
}
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-img .placeholder { font-size: 36px; opacity: 0.4; }
.card-img .time-badge {
  position: absolute; bottom: 6px; left: 6px;
  background: var(--img-overlay); color: var(--accent);
  padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
}
.card-img .count-badge {
  position: absolute; top: 6px; right: 6px;
  background: var(--accent); color: var(--accent-on);
  padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700;
}
.card-actions {
  position: absolute; bottom: 6px; right: 6px;
  display: flex; gap: 4px; z-index: 2;
}
.icon-circle {
  width: 28px; height: 28px; border-radius: 50%;
  border: none; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  transition: transform 0.15s;
}
.icon-circle:active { transform: scale(0.9); }
.icon-circle.plus { background: var(--accent); color: var(--accent-on); }
.icon-circle.plus.recent { background: var(--good); color: #fff; }
/* 购物车 icon:柔和 chip 风格,用 accent 系而不是饱和蓝 */
.icon-circle.cart {
  background: var(--bg-2); color: var(--accent);
  border: 1px solid var(--border);
  font-size: 15px;
}
.icon-circle.cart.in-cart { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }

.card-body { padding: 10px 12px; }
.card-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-meta { display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--text-dim); }
.card-rating { color: var(--accent); font-weight: 700; }
.card-rating.dim { color: var(--text-mute); }

.ranking-list { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px 12px; margin-bottom: 8px; }
.ranking-item {
  display: flex; align-items: center; padding: 10px 0;
  border-bottom: 1px solid var(--border); gap: 10px;
}
.ranking-item:last-child { border-bottom: none; }
.rank-num {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px; flex-shrink: 0;
}
.rank-1 { background: var(--rank-1); color: var(--rank-on); }
.rank-2 { background: var(--rank-2); color: var(--rank-on); }
.rank-3 { background: var(--rank-3); color: var(--rank-on); }
.rank-other { background: var(--bg-2); color: var(--text-dim); border: 1px solid var(--border); }
.rank-name { flex: 1; font-size: 14px; font-weight: 600; }
.rank-info { font-size: 11px; color: var(--text-dim); text-align: right; }
.rank-info .count-num { font-size: 15px; color: var(--accent); font-weight: 700; }
.rank-info .rating { color: var(--text-mute); font-size: 10px; }

.empty { text-align: center; padding: 40px 20px; color: var(--text-mute); font-size: 13px; }
.empty .emoji { font-size: 48px; margin-bottom: 12px; }

/* FABs */
.fab {
  position: fixed; bottom: 20px; right: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: var(--accent-on); border: none;
  font-size: 28px; font-weight: 700; cursor: pointer;
  box-shadow: var(--shadow-lg); z-index: 100;
  transition: transform .15s;
}
.fab:active { transform: scale(0.95); }

/* 购物车 FAB:用 accent 系而非饱和蓝 */
.cart-fab {
  position: fixed; bottom: 20px; left: 20px;
  min-width: 56px; height: 56px; padding: 0 16px; border-radius: 28px;
  background: var(--accent); color: var(--accent-on); border: none;
  font-size: 22px; font-weight: 700; cursor: pointer;
  box-shadow: var(--shadow-lg); z-index: 100;
  display: flex; align-items: center; gap: 6px;
  transition: transform .15s, opacity .2s;
}
.cart-fab:active { transform: scale(0.95); }
.cart-fab .badge {
  background: var(--bad); color: #fff;
  border-radius: 10px; padding: 2px 8px; font-size: 12px; font-weight: 700;
  min-width: 20px; text-align: center;
}
.cart-fab.empty { opacity: 0.4; }

/* Modals */
.modal-bg {
  position: fixed; inset: 0; background: var(--modal-bg);
  z-index: 200; display: none; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--card); border-radius: 16px 16px 0 0;
  width: 100%; max-width: 600px; max-height: 90vh;
  overflow-y: auto; padding: 20px 16px 30px;
}
@media (min-width: 768px) { .modal-bg { align-items: center; } .modal { border-radius: 16px; } }
.modal h2 { color: var(--accent); font-size: 18px; margin-bottom: 14px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 12px; border-radius: 8px;
  background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
  font-size: 14px; font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--accent);
}
.form-group textarea { min-height: 80px; resize: vertical; }
.btn-row { display: flex; gap: 8px; margin-top: 16px; }
.btn {
  flex: 1; padding: 12px; border-radius: 10px; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: transform .15s, background-color .2s, opacity .2s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: var(--accent-on); }
.btn-primary:hover { opacity: 0.92; }
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg-2); color: var(--text); }
.btn-danger { background: var(--bad); color: #fff; }
.btn-good { background: var(--good); color: #fff; }

.rating-row { display: flex; gap: 4px; }
.rating-row .star { font-size: 22px; cursor: pointer; color: var(--text-mute); }
.rating-row .star.on { color: var(--accent); }

/* Photo */
.photo-preview {
  width: 100%; max-width: 200px; aspect-ratio: 1/1;
  border-radius: 10px; background: var(--input-bg); border: 1px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text-dim); cursor: pointer;
  overflow: hidden; margin-bottom: 6px;
  transition: border-color .2s;
}
.photo-preview:hover { border-color: var(--accent); }
.photo-preview img { width: 100%; height: 100%; object-fit: counter; }

/* Ingredients */
.ingredient-row {
  display: flex; gap: 4px; margin-bottom: 4px; align-items: center;
}
.ingredient-row input { flex: 1; }
.ingredient-row input.qty { max-width: 70px; }
.ingredient-row input.unit { max-width: 70px; }
.ingredient-row button {
  background: transparent; border: none; color: var(--bad);
  font-size: 18px; cursor: pointer; padding: 4px 8px;
}
.add-ingredient-btn {
  background: transparent; border: 1px dashed var(--border);
  color: var(--text-dim); padding: 8px; border-radius: 8px;
  width: 100%; cursor: pointer; font-size: 13px; margin-top: 4px;
}

/* Detail modal adjust buttons */
.adjust-row { display: flex; gap: 4px; }
.adjust-row button {
  flex: 1; padding: 8px 4px; border-radius: 8px; background: var(--bg-2);
  color: var(--text-dim); border: 1px solid var(--border); font-size: 13px; cursor: pointer;
}
.adjust-row button:active { background: var(--accent); color: var(--accent-on); }
.adjust-row button.plus:active { background: var(--good); color: #fff; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--good); color: #fff; padding: 10px 20px; border-radius: 8px;
  font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.warn { background: var(--warn); }
.toast.err { background: var(--bad); }

.detail-recipe { margin-top: 14px; padding: 12px; background: var(--bg-2); border-radius: 8px; }
.detail-recipe h3 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
.detail-recipe pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; line-height: 1.6; }

/* Cart modal specific */
.cart-list { margin: 12px 0; }
.cart-item {
  display: flex; align-items: center; gap: 10px; padding: 10px;
  background: var(--bg-2); border-radius: 8px; margin-bottom: 6px;
}
.cart-item .ci-img {
  width: 48px; height: 48px; border-radius: 6px;
  background: var(--card); flex-shrink: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.cart-item .ci-img img { width: 100%; height: 100%; object-fit: cover; }
.cart-item .ci-name { flex: 1; font-size: 14px; font-weight: 600; }
.cart-item .ci-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.cart-item button {
  background: transparent; border: none; color: var(--bad);
  font-size: 18px; cursor: pointer; padding: 6px 10px;
}

.shopping-list {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin: 10px 0;
}
.shopping-list h4 { font-size: 12px; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.shopping-list ul { list-style: none; padding: 0; margin: 0; }
.shopping-list li {
  display: flex; justify-content: space-between; padding: 4px 0;
  font-size: 13px; border-bottom: 1px solid var(--border);
}
.shopping-list li:last-child { border-bottom: none; }
.shopping-list li .qty { color: var(--accent); font-weight: 600; }
.shopping-list .empty-warn {
  color: var(--warn); font-size: 12px; padding: 6px 0;
}

/* Date picker popup (from cart icon) */
.date-picker-popup {
  position: fixed; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 6px; z-index: 300;
  box-shadow: var(--shadow-lg); min-width: 160px;
}
.date-picker-popup button {
  display: block; width: 100%; padding: 10px 14px;
  background: transparent; border: none; color: var(--text);
  text-align: left; cursor: pointer; border-radius: 6px; font-size: 14px;
}
.date-picker-popup button:active { background: var(--accent); color: var(--accent-on); }
.date-picker-popup button small { color: var(--text-dim); display: block; font-size: 11px; }

/* === Search box === */
.search-row {
  display: flex; align-items: center; gap: 8px;
  margin: 10px 4px 12px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 8px 12px;
  transition: border-color .2s, box-shadow .2s;
}
.search-row:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
.search-row .search-icon { color: var(--text-dim); font-size: 16px; line-height: 1; }
.search-row input {
  flex: 1; border: none; background: transparent; color: var(--text);
  font-size: 14px; outline: none; padding: 0;
  font-family: inherit;
}
.search-row input::placeholder { color: var(--text-mute); }
.search-clear {
  background: var(--bg-2); border: none; color: var(--text-dim);
  width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
  font-size: 14px; line-height: 1; display: none; align-items: center; justify-content: center;
}
.search-clear:hover { background: var(--border); color: var(--text); }
.search-clear.show { display: flex; }

/* === Theme picker (settings modal) === */
.theme-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  margin: 10px 0;
}
.theme-card {
  border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  cursor: pointer; background: var(--bg-2); position: relative;
  transition: border-color .2s, transform .15s;
}
.theme-card:active { transform: scale(0.98); }
.theme-card.selected { border-color: var(--accent); border-width: 2px; padding: 11px; }
.theme-card .theme-swatch {
  display: flex; gap: 4px; height: 28px; border-radius: 8px; overflow: hidden;
  margin-bottom: 8px; border: 1px solid var(--border);
}
.theme-card .theme-swatch span { flex: 1; }
.theme-card .theme-name { font-size: 14px; font-weight: 600; color: var(--text); }
.theme-card .theme-desc { font-size: 11px; color: var(--text-mute); margin-top: 2px; }
.theme-card .theme-check {
  position: absolute; top: 8px; right: 10px;
  color: var(--accent); font-size: 16px; opacity: 0;
}
.theme-card.selected .theme-check { opacity: 1; }

</style>
</head>
<body>

<header>
  <h1>🍳 早餐菜单库</h1>
  <div class="header-actions">
    <button class="icon-btn" onclick="exportData()" title="导出 JSON 备份">💾</button>
    <button class="icon-btn" onclick="importData()" title="导入 JSON">📥</button>
    <button class="icon-btn" onclick="openSettings()" title="主题 / 设置" id="settingsBtn">🎨</button>
  </div>
</header>

<!-- 待做餐 banner (跨日期聚合,可点开选日期) -->
<div id="todayBanner" class="today-banner empty" onclick="openPlanDatePicker()">
  <span id="todayBannerText">📋 待做餐：无 ▾</span>
  <span class="arrow" id="todayBannerArrow">›</span>
</div>
<!-- 一周预览 (banner 下方) -->
<div id="weekPreview" class="week-preview"></div>

<!-- Top stats -->
<div class="stats-bar">
  <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总菜数</div></div>
  <div class="stat"><div class="stat-num" id="statBreakfast">0</div><div class="stat-label" id="breakfastLabel">早餐档</div></div>
  <div class="stat"><div class="stat-num" id="statUrgent">0</div><div class="stat-label" id="urgentLabel">待翻牌</div></div>
</div>

<!-- Ranking -->
<div class="section-title">🏆 排行榜 <span class="count" id="rankingCount">0</span></div>
<div class="tabs" id="rankTabs" style="margin-bottom:8px;">
  <div class="tab active" data-rank="all">全部</div>

<script>
const STORAGE_KEY = 'breakfast-menu-v1';
const DATA_VERSION = 1;

let state = loadState();
let editingId = null;
let currentTab = 'all';
let currentRating = { banli: 0, niuniu: 0, wife: 0 };
let currentPhoto = null;
let currentRankTab = 'all';
let currentIngredients = [];   // 编辑 modal 的临时食材
let currentCartTab = null;     // 购物车 modal 当前选中的日期
let lastPlusTap = {};
let datePickerCallback = null;
let currentSearch = '';        // 搜索关键词

/* ========== v2.0 主题切换(放在 state 之后、render 之前) =========== */
const THEMES = {
  dark: { name: '深色(夜读)', desc: '深底 + 金色 · 默认',
    bg: '#12161F', card: '#1A1F2B', border: '#2A3142', text: '#E8ECF2',
    accent: '#E8B660', accentOn: '#12161F' },
  light: { name: '浅色(暖白)', desc: '暖白 + 暖橙 · 白天友好',
    bg: '#FAF8F3', card: '#FFFFFF', border: '#E5DFD3', text: '#2A2520',
    accent: '#C08840', accentOn: '#FFFFFF' },
};
const THEME_KEY = 'breakfast-menu-theme';

function applyTheme(id, persist=true) {
  const t = THEMES[id];
  if (!t) return;
  document.documentElement.setAttribute('data-theme', id);
  // 同步 meta theme-color(浏览器顶栏色,iOS PWA 必看)
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t.bg);
  if (persist) { try { localStorage.setItem(THEME_KEY, id); } catch(e){} }
}

function loadTheme() {
  let id;
  try { id = localStorage.getItem(THEME_KEY) || 'dark'; } catch(e){ id='dark'; }
  applyTheme(id, false);  // 启动不持久化,保留默认行为
}

function openSettings() {
  const grid = document.getElementById('themeGrid');
  let cur;
  try { cur = localStorage.getItem(THEME_KEY) || 'dark'; } catch(e){ cur='dark'; }
  grid.innerHTML = Object.entries(THEMES).map(([id, t]) => {
    const sel = cur === id;
    return `
    <div class="theme-card ${sel?'selected':''}" data-theme="${id}">
      <div class="theme-swatch">
        <span style="background:${t.bg}"></span>
        <span style="background:${t.card}"></span>
        <span style="background:${t.border}"></span>
        <span style="background:${t.accent}"></span>
      </div>
      <div class="theme-name">${t.name}</div>
      <div class="theme-desc">${t.desc}</div>
      <div class="theme-check">✓</div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.theme-card').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.theme;
      applyTheme(id);
      openSettings(); // 刷新选中状态
    });
  });
  document.getElementById('settingsBg').classList.add('show');
}
function closeSettings() {
  document.getElementById('settingsBg').classList.remove('show');
}
document.getElementById('settingsBg').addEventListener('click', e => {
  if (e.target.id === 'settingsBg') closeSettings();
});
function resetTheme() {
  try { localStorage.removeItem(THEME_KEY); } catch(e){}
  applyTheme('dark');
  openSettings();
  toast('已重置为深色主题');
}
loadTheme();  // 启动立即应用主题(在 render 之前,避免颜色闪一下)

/* ========== 搜索过滤 =========== */
function onSearchInput() {
  const v = document.getElementById('searchInput').value.trim().toLowerCase();
  currentSearch = v;
  document.getElementById('searchClear').classList.toggle('show', v.length > 0);
  renderGrid();
  renderRanking();
}
function clearSearch() {
  document.getElementById('searchInput').value = '';
  onSearchInput();
  document.getElementById('searchInput').focus();
}
function dishMatchesSearch(d, q) {
  if (!q) return true;
  if ((d.name || '').toLowerCase().includes(q)) return true;
  if ((d.tags || []).some(t => t.toLowerCase().includes(q))) return true;
  if ((d.ingredients || []).some(i => (i.name || '').toLowerCase().includes(q))) return true;
  return false;
}

// === Storage ===
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { version: DATA_VERSION, dishes: [], cart: {} };
    const d = JSON.parse(raw);
    if (d.version !== DATA_VERSION) return { version: DATA_VERSION, dishes: d.dishes || [], cart: {} };
    if (!d.cart) d.cart = {};
    // 兼容性：给旧 dish 补字段
    d.dishes.forEach(x => {
      x.ingredients = x.ingredients || [];
      x.planned_for = x.planned_for || [];
    });
    return d;
  } catch { return { version: DATA_VERSION, dishes: [], cart: {} }; }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  render();
}

// === Date helpers ===
const now = new Date();
const today = now.toISOString().slice(0, 10);
const weekdayName = (iso) => { const d = new Date(iso); return '周' + '日一二三四五六'[d.getDay()]; };
const fmtDate = (iso) => { const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()}`; };
const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
const daysFromNow = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const labelForDays = (n) => {
  if (n === 0) return '今天';
  if (n === 1) return '明天';
  if (n === 2) return '后天';
  if (n === 3) return '大后天';
  return daysFromNow(n);
};

// === Seed ===
function seedIfEmpty() {
  if (state.dishes.length > 0) return;
  state.dishes = [
    { id: 'd_seed_001', name: '番茄鸡蛋三明治', category: 'breakfast-fast', time_min: 15, photo: null, made_count: 8, last_made: daysAgo(12), ratings: { banli: 5, niuniu: 4, wife: null }, recipe: null,
      ingredients: [{name:'吐司',qty:2,unit:'片'},{name:'鸡蛋',qty:1,unit:'个'},{name:'番茄',qty:0.5,unit:'个'},{name:'生菜',qty:2,unit:'片'}],
      planned_for: [], tags: ['快手','板栗最爱'] },
    { id: 'd_seed_002', name: '牛奶麦片', category: 'breakfast-fast', time_min: 5, photo: null, made_count: 15, last_made: daysAgo(2), ratings: { banli: 4, niuniu: 5, wife: 3 }, recipe: null,
      ingredients: [{name:'牛奶',qty:250,unit:'ml'},{name:'麦片',qty:50,unit:'g'}],
      planned_for: [], tags: ['极速','妞妞最爱'] },
    { id: 'd_seed_003', name: '煎蛋吐司', category: 'breakfast-fast', time_min: 10, photo: null, made_count: 6, last_made: daysAgo(7), ratings: { banli: 5, niuniu: 3, wife: 4 }, recipe: null,
      ingredients: [{name:'吐司',qty:2,unit:'片'},{name:'鸡蛋',qty:1,unit:'个'}],
      planned_for: [], tags: ['快手'] },
    { id: 'd_seed_004', name: '葱油拌面', category: 'breakfast-slow', time_min: 25, photo: null, made_count: 3, last_made: daysAgo(20), ratings: { banli: 4, niuniu: 2, wife: 5 }, recipe: null,
      ingredients: [{name:'面条',qty:1,unit:'把'},{name:'葱',qty:3,unit:'根'},{name:'生抽',qty:2,unit:'勺'},{name:'猪油',qty:1,unit:'勺'}],
      planned_for: [], tags: ['慢工','老婆最爱'] },
    { id: 'd_seed_005', name: '红烧肉', category: 'dinner', time_min: 90, photo: null, made_count: 2, last_made: daysAgo(45), ratings: { banli: 5, niuniu: 4, wife: 5 },
      recipe: '① 五花肉切块焯水\n② 锅中炒糖色（冰糖小火）\n③ 下肉翻炒上色\n④ 加老抽生抽八角，水没过肉\n⑤ 大火烧开转小火 1 小时，大火收汁',
      ingredients: [{name:'五花肉',qty:500,unit:'g'},{name:'冰糖',qty:30,unit:'g'},{name:'老抽',qty:2,unit:'勺'},{name:'生抽',qty:3,unit:'勺'},{name:'八角',qty:2,unit:'个'}],
      planned_for: [], tags: ['周末大菜'] },
    { id: 'd_seed_006', name: '番茄鸡蛋面', category: 'breakfast-fast', time_min: 12, photo: null, made_count: 4, last_made: daysAgo(5), ratings: { banli: 4, niuniu: 5, wife: 4 }, recipe: null,
      ingredients: [{name:'面条',qty:1,unit:'把'},{name:'番茄',qty:1,unit:'个'},{name:'鸡蛋',qty:1,unit:'个'}],
      planned_for: [], tags: ['快手'] },
  ];
  saveState();
}
seedIfEmpty();

// === Render ===
function render() {
  renderTodayBanner();
  renderStats();
  renderRanking();
  renderGrid();
  renderCartFab();
}

function renderTodayBanner() {
  // 跨日期聚合：所有 planned_for 不空的菜
  const allPlanned = state.dishes.filter(d => (d.planned_for || []).length > 0);
  const total = allPlanned.reduce((sum, d) => sum + d.planned_for.length, 0);
  const el = document.getElementById('todayBanner');
  const txt = document.getElementById('todayBannerText');
  if (total === 0) {
    el.className = 'today-banner empty';
    txt.textContent = '📋 待做餐：无 ▾';
  } else {
    el.className = 'today-banner';
    txt.textContent = `📋 待做餐 ${total} 道 · 点这里看 ▾`;
  }
  renderWeekPreview();
}

function renderWeekPreview() {
  const wrap = document.getElementById('weekPreview');
  // 显示今天 + 后 6 天
  const cells = [];
  for (let i = 0; i < 7; i++) {
    const date = daysFromNow(i);
    const dishesOnDay = state.dishes.filter(d => (d.planned_for || []).includes(date));
    const isToday = i === 0;
    const label = i === 0 ? '今天' : i === 1 ? '明天' : i === 2 ? '后天' : weekdayName(date).replace('周', '');
    cells.push(`
      <div class="day-cell ${isToday ? 'today' : ''}" onclick="openPlanForDate('${date}')">
        <div class="dc-name">${label}</div>
        <div class="dc-date">${fmtDate(date)}</div>
        <span class="dc-count ${dishesOnDay.length === 0 ? 'zero' : ''}">${dishesOnDay.length}</span>
      </div>
    `);
  }
  wrap.innerHTML = cells.join('');
}

function renderStats() {
  document.getElementById('statTotal').textContent = state.dishes.length;
  const tabMap = {
    'all': { filter: () => true, label: '全部' },
    'breakfast-fast': { filter: d => d.category === 'breakfast-fast', label: '⚡快手' },
    'breakfast-slow': { filter: d => d.category === 'breakfast-slow', label: '🐢慢工' },
    'dinner': { filter: d => d.category === 'dinner', label: '正餐' },
  };
  const cfg = tabMap[currentTab] || tabMap['all'];
  document.getElementById('statBreakfast').textContent = state.dishes.filter(cfg.filter).length;
  document.getElementById('breakfastLabel').textContent = cfg.label;
  const urgentDays = daysAgo(30);
  // 搜索模式下:用「过滤后」的列表算 urgent,避免数字跟卡片数对不上
  let pool = state.dishes.filter(cfg.filter);
  if (currentSearch) pool = pool.filter(d => dishMatchesSearch(d, currentSearch));
  const urgent = pool.filter(d => d.last_made < urgentDays).length;
  document.getElementById('statUrgent').textContent = urgent;
}

function getRanking(scope) {
  let list = state.dishes;
  if (scope === 'breakfast') list = list.filter(d => d.category.startsWith('breakfast'));
  else if (scope === 'dinner') list = list.filter(d => d.category === 'dinner');
  // 搜索模式下:再过滤一次
  if (currentSearch) list = list.filter(d => dishMatchesSearch(d, currentSearch));
  // 排名规则:① 评分 < 3 的菜不上榜(不真爱)② 主要按 made_count 降序 ③ 次数相同按平均分
  const scored = list.map(d => {
    const rs = Object.values(d.ratings || {}).filter(r => r != null);
    const avg = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : 0;
    return { ...d, avg };
  }).filter(d => d.avg >= 3 && d.made_count > 0);   // 必须做过且平均分 ≥ 3
  scored.sort((a, b) => b.made_count - a.made_count || b.avg - a.avg);
  return scored.slice(0, 5);
}

function renderRanking() {
  const top = getRanking(currentRankTab);
  const el = document.getElementById('rankingList');
  document.getElementById('rankingCount').textContent = top.length;
  const scopeLabel = currentRankTab === 'breakfast' ? '早餐' : currentRankTab === 'dinner' ? '正餐' : '';
  if (top.length === 0) {
    el.className = 'empty';
    el.innerHTML = `<div class="emoji">🍽️</div>${scopeLabel ? scopeLabel + '还没' : '还没'}上榜的菜<br><span style="font-size:11px;color:var(--text-mute);">（做过且平均分 ≥ 3 才会出现）</span>`;
    return;
  }
  el.className = 'ranking-list';
  el.innerHTML = top.map((d, i) => `
    <div class="ranking-item" onclick="openDetail('${d.id}')">
      <div class="rank-num ${i < 3 ? 'rank-' + (i+1) : 'rank-other'}">${i+1}</div>
      <div class="rank-name">${escape(d.name)}</div>
      <div class="rank-info">
        <div class="count-num">${d.made_count}次</div>
        <div class="rating">★${d.avg.toFixed(1)}</div>
      </div>
    </div>
  `).join('');
}

function avgR(d) {
  const rs = Object.values(d.ratings || {}).filter(r => r != null);
  return rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : 0;
}

function lastMadeLabel(lm) {
  if (!lm) return '没做过';
  if (lm === today) return '今天';
  const days = Math.floor((Date.now() - new Date(lm)) / 86400000);
  if (days === 1) return '昨天';
  if (days < 7) return `${days}天前`;
  if (days < 30) return `${Math.floor(days/7)}周前`;
  return `${Math.floor(days/30)}个月前 🔔`;
}

function renderGrid() {
  const grid = document.getElementById('cardGrid');
  let list = [...state.dishes];
  if (currentTab !== 'all') list = list.filter(d => d.category === currentTab);
  // 搜索过滤
  if (currentSearch) list = list.filter(d => dishMatchesSearch(d, currentSearch));
  const urgentDays = daysAgo(30);
  list.sort((a, b) => {
    const aU = a.last_made < urgentDays, bU = b.last_made < urgentDays;
    if (aU !== bU) return aU ? -1 : 1;
    return a.name.localeCompare(b.name, 'zh');
  });
  if (list.length === 0) {
    const msg = currentSearch
      ? `<div class="emoji">🔍</div>没搜到「${escape(currentSearch)}」相关菜`
      : `<div class="emoji">👨‍🍳</div>这个分类还没有菜`;
    grid.innerHTML = `<div class="empty" style="grid-column: 1/-1;">${msg}</div>`;
    return;
  }
  grid.innerHTML = list.map(d => {
    const urgent = d.last_made < urgentDays;
    const avgRating = avgR(d);
    const photoHtml = d.photo ? `<img src="${d.photo}" loading="lazy">` : `<span class="placeholder">🍳</span>`;
    const isRecent = d.last_made === today;
    return `
    <div class="card ${urgent ? 'urgent' : ''}" onclick="openDetail('${d.id}')">
      <div class="card-img">
        ${photoHtml}
        <div class="time-badge">⏱ ${d.time_min}min</div>
        ${d.made_count > 0 ? `<div class="count-badge">×${d.made_count}</div>` : ''}
        <div class="card-actions">
          <button class="icon-circle cart" onclick="event.stopPropagation();openDatePicker(event, '${d.id}')" title="加入购物车">🛒</button>
          <button class="icon-circle plus ${isRecent ? 'recent' : ''}"
            onclick="event.stopPropagation();quickPlus('${d.id}')"
            title="${isRecent ? '今天已做过 +1' : '点 +1（双击 +3，长按自定）'}">${isRecent ? '✓' : '+'}</button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-name">${escape(d.name)}${urgent ? ' 🔔' : ''}</div>
        <div class="card-meta">
          <span>${lastMadeLabel(d.last_made)}</span>
          <span class="card-rating ${avgRating ? '' : 'dim'}">${avgRating ? '★' + avgRating.toFixed(1) : '未评'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function escape(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c])); }

// === Photo upload ===
function onPhotoSelected(ev) {
  const file = ev.target.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { toast('请选图片', 'err'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 800;
      let w = img.width, h = img.height;
      if (w > h && w > max) { h = h * max / w; w = max; }
      else if (h > max) { w = w * max / h; h = max; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      currentPhoto = canvas.toDataURL('image/jpeg', 0.7);
      showPhotoPreview(currentPhoto);
      toast('照片已加载 ✅');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function showPhotoPreview(dataUrl) {
  const preview = document.getElementById('photoPreview');
  if (dataUrl) preview.innerHTML = `<img src="${dataUrl}">`;
  else preview.innerHTML = '<span id="photoPreviewText">点击上传照片</span>';
}
function clearPhoto() { currentPhoto = null; showPhotoPreview(null); document.getElementById('inpPhoto').value = ''; }

// === Save ===
function saveDish() {
  const name = document.getElementById('inpName').value.trim();
  if (!name) { toast('请填菜名', 'err'); return; }
  const data = {
    name,
    category: document.getElementById('inpCategory').value,
    time_min: parseInt(document.getElementById('inpTime').value) || 15,
    ratings: {
      banli: currentRating.banli || null,
      niuniu: currentRating.niuniu || null,
      wife: currentRating.wife || null,
    },
    recipe: document.getElementById('inpRecipe').value.trim() || null,
    ingredients: currentIngredients.filter(x => x.name && x.name.trim()).map(x => ({
      name: x.name.trim(),
      qty: typeof x.qty === 'number' ? x.qty : (parseFloat(x.qty) || 0),
      unit: (x.unit || '').trim(),
    })),
  };
  if (editingId) {
    const d = state.dishes.find(x => x.id === editingId);
    Object.assign(d, data);
    d.photo = currentPhoto;
    toast('已更新 ✅');
  } else {
    state.dishes.push({
      id: 'd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      ...data,
      photo: currentPhoto,
      made_count: 0,
      last_made: null,
      planned_for: [],
      tags: [],
    });
    toast('已加 ✅');
  }
  saveState();
  closeModal();
}
function deleteDish() {
  if (!editingId) return;
  if (!confirm('确定删除这道菜？')) return;
  state.dishes = state.dishes.filter(x => x.id !== editingId);
  // 也清理购物车里残留
  for (const date of Object.keys(state.cart)) {
    state.cart[date] = state.cart[date].filter(id => state.dishes.find(d => d.id === id));
    if (state.cart[date].length === 0) delete state.cart[date];
  }
  saveState();
  closeModal();
  toast('已删除');
}

// === Quick +N (卡片右下 + 按钮) ===
function quickPlus(id) {
  const d = state.dishes.find(x => x.id === id);
  if (!d) return;
  const t0 = lastPlusTap[id] || 0;
  if (Date.now() - t0 < 400) {
    addCount(d, 3); lastPlusTap[id] = 0;
    toast(`${d.name} +3`);
  } else {
    addCount(d, 1); lastPlusTap[id] = Date.now();
  }
  saveState();
}
function addCount(d, n) {
  d.made_count = (d.made_count || 0) + n;
  d.last_made = today;
  render();
}
// 长按 -N/+N 自定义
let longPressTimer = null;
document.addEventListener('mousedown', e => {
  const btn = e.target.closest && e.target.closest('.icon-circle.plus');
  if (!btn) return;
  const id = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
  longPressTimer = setTimeout(() => {
    const d = state.dishes.find(x => x.id === id);
    if (!d) return;
    const v = prompt(`${d.name} 调整次数（正数加 / 负数减），例如 +3 或 -2`, '+1');
    if (v === null) return;
    const n = parseInt(v) || 0;
    if (n === 0) return;
    d.made_count = Math.max(0, (d.made_count || 0) + n);
    if (n > 0) d.last_made = today;
    saveState();
    toast(`${d.name} ${n>0?'+':''}${n}`);
  }, 600);
});
document.addEventListener('mouseup', () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } });
document.addEventListener('contextmenu', e => { if (e.target.classList && e.target.classList.contains('icon-circle')) e.preventDefault(); });

// === Date picker popup (购物车图标) ===
function openDatePicker(ev, dishId) {
  ev.stopPropagation();
  const rect = ev.currentTarget.getBoundingClientRect();
  const popup = document.getElementById('datePickerPopup');
  popup.innerHTML = '';
  [1, 2, 3].forEach(n => {
    const date = daysFromNow(n);
    const btn = document.createElement('button');
    btn.innerHTML = `${labelForDays(n)} <small>${fmtDate(date)} ${weekdayName(date)}</small>`;
    btn.onclick = () => {
      addToCart(dishId, date);
      popup.style.display = 'none';
    };
    popup.appendChild(btn);
  });
  popup.style.display = 'block';
  // 定位
  let top = rect.bottom + 8;
  let left = rect.left;
  if (left + 180 > window.innerWidth) left = window.innerWidth - 190;
  popup.style.top = top + 'px';
  popup.style.left = Math.max(8, left) + 'px';
  setTimeout(() => {
    document.addEventListener('click', closeDatePickerOnce, { once: true });
  }, 100);
}
function closeDatePickerOnce(e) {
  const popup = document.getElementById('datePickerPopup');
  if (popup && !popup.contains(e.target)) popup.style.display = 'none';
}

function addToCart(dishId, date) {
  if (!state.cart[date]) state.cart[date] = [];
  if (state.cart[date].includes(dishId)) {
    toast('这道菜已在购物车', 'warn');
    return;
  }
  state.cart[date].push(dishId);
  saveState();
  const d = state.dishes.find(x => x.id === dishId);
  toast(`${d.name} → ${labelForDate(date)}的菜单 🛒`);
}

function cartCount() {
  let n = 0;
  for (const k of Object.keys(state.cart)) n += state.cart[k].length;
  return n;
}

function renderCartFab() {
  const fab = document.getElementById('cartFab');
  const badge = document.getElementById('cartBadge');
  const n = cartCount();
  if (n === 0) {
    fab.classList.add('empty');
    badge.style.display = 'none';
  } else {
    fab.classList.remove('empty');
    badge.style.display = '';
    badge.textContent = n;
  }
}

function labelForDate(iso) {
  const n = Math.round((new Date(iso) - new Date(today)) / 86400000);
  return labelForDays(n);
}

function openCart() {
  if (cartCount() === 0) { toast('购物车是空的，先点卡片上的 🛒 加菜'); return; }
  // 默认选最早的日期

function renderCartTabs() {

function renderCartList() {
  const ids = state.cart[currentCartTab] || [];
  const list = document.getElementById('cartList');
  document.getElementById('cartTotalCount').textContent = `共 ${cartCount()} 道菜`;
  if (ids.length === 0) {

  }

    return `

      <div class="ci-img">${photoHtml}</div>

        <div class="ci-name">${escape(d.name)}</div>

  }).join('');

function removeFromCart(id) {
  if (!state.cart[currentCartTab]) return;
  state.cart[currentCartTab] = state.cart[currentCartTab].filter(x => x !== id);
  if (state.cart[currentCartTab].length === 0) {
    delete state.cart[currentCartTab];
    const dates = Object.keys(state.cart).filter(d => state.cart[d].length > 0).sort();
    currentCartTab = dates[0] || null;
  }
  saveState();
  if (!currentCartTab) closeCart();
  else { renderCartTabs(); renderCartList(); }
}

function renderShoppingList(ids) {
  const wrap = document.getElementById('shoppingListWrap');
  const ul = document.getElementById('shoppingListUl');
  // 同食材去重累加
  const map = {}; // name -> {qty, unit, sources}
  let noIng = [];
  ids.forEach(id => {
    const d = state.dishes.find(x => x.id === id);
    if (!d) return;
    if (!d.ingredients || d.ingredients.length === 0) {
      noIng.push(d.name);
      return;
    }
    d.ingredients.forEach(ing => {
      const k = ing.name.trim();
      if (!map[k]) map[k] = { qty: 0, unit: ing.unit || '', sources: [] };
      map[k].qty += (parseFloat(ing.qty) || 0);
      if (!map[k].sources.includes(d.name)) map[k].sources.push(d.name);
    });
  });
  const keys = Object.keys(map);
  if (keys.length === 0 && noIng.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  let html = '';
  if (keys.length > 0) {
    html += keys.sort().map(k => `
      <li>
        <span>${escape(k)} <span style="color:var(--text-mute);font-size:11px;">· ${map[k].sources.map(escape).join('/')}</span></span>
        <span class="qty">${map[k].qty % 1 === 0 ? map[k].qty : map[k].qty.toFixed(1)} ${escape(map[k].unit)}</span>
      </li>`).join('');
  }
  if (noIng.length > 0) {
    html += `<li class="empty-warn">⚠️ ${noIng.map(escape).join('、')}（无食材清单，采购时手动看）</li>`;
  }
  ul.innerHTML = html;
}

function copyShoppingList() {
  const ids = state.cart[currentCartTab] || [];
  if (ids.length === 0) { toast('购物车为空', 'warn'); return; }
  // 复用 renderShoppingList 计算（同食材去重累加）
  const map = {};
  let noIng = [];
  ids.forEach(id => {
    const d = state.dishes.find(x => x.id === id);
    if (!d) return;
    if (!d.ingredients || d.ingredients.length === 0) { noIng.push(d.name); return; }
    d.ingredients.forEach(ing => {
      const k = ing.name.trim();
      if (!map[k]) map[k] = { qty: 0, unit: ing.unit || '' };
      map[k].qty += (parseFloat(ing.qty) || 0);
    });
  });
  let txt = `【${labelForDate(currentCartTab)} 采购清单 · ${fmtDate(currentCartTab)} ${weekdayName(currentCartTab)}】\n\n`;
  Object.keys(map).sort().forEach(k => {
    const q = map[k].qty % 1 === 0 ? map[k].qty : map[k].qty.toFixed(1);
    txt += `· ${k} ${q}${map[k].unit}\n`;
  });
  if (noIng.length > 0) txt += `\n⚠️ ${noIng.join('、')} 食材清单未填\n`;
  txt += `\n（来自早餐菜单库 · ${ids.length} 道菜）`;
  navigator.clipboard.writeText(txt).then(
    () => toast('已复制采购清单 📋'),
    () => toast('复制失败，请手动选', 'err')
  );
}

function confirmCart() {
  const date = currentCartTab;
  const ids = state.cart[date] || [];
  if (ids.length === 0) { toast('购物车为空', 'warn'); return; }
  if (!confirm(`确认把 ${ids.length} 道菜加入【${labelForDate(date)}】待做清单？`)) return;
  ids.forEach(id => {
    const d = state.dishes.find(x => x.id === id);
    if (!d) return;
    d.planned_for = d.planned_for || [];
    if (!d.planned_for.includes(date)) d.planned_for.push(date);
  });
  delete state.cart[date];
  const dates = Object.keys(state.cart).filter(d => state.cart[d].length > 0).sort();
  currentCartTab = dates[0] || null;
  saveState();
  if (!currentCartTab) closeCart();
  else { renderCartTabs(); renderCartList(); }
  toast(`${ids.length} 道菜已加入【${labelForDate(date)}】待做 ✅`);
}

function openPlanForDate(date) {

function closeTodayPlan() { document.getElementById('todayPlanBg').classList.remove('show'); }
document.getElementById('todayPlanBg').addEventListener('click', e => { if (e.target.id === 'todayPlanBg') closeTodayPlan(); });

function donePlanDish(id) {
  const d = state.dishes.find(x => x.id === id);
  if (!d) return;
  d.made_count = (d.made_count || 0) + 1;
  d.last_made = today;
  d.planned_for = (d.planned_for || []).filter(x => x !== planModalDate);
  saveState();
  // 如果该日期还有菜就刷新，否则关 modal
  const remain = state.dishes.filter(x => (x.planned_for || []).includes(planModalDate));
  if (remain.length === 0) {
    closeTodayPlan();
    toast(`${labelForDate(planModalDate)}待做全部完成 🎉`);
  } else {
    openPlanForDate(planModalDate);
    toast(`${d.name} 已完成 ✅`);
  }
}
function doneAllToday() {
  const dayDishes = state.dishes.filter(d => (d.planned_for || []).includes(planModalDate));
  if (dayDishes.length === 0) return;
  if (!confirm(`把 ${labelForDate(planModalDate)} ${dayDishes.length} 道菜全部标记为已完成？`)) return;
  dayDishes.forEach(d => {
    d.made_count = (d.made_count || 0) + 1;
    d.last_made = today;
    d.planned_for = (d.planned_for || []).filter(x => x !== planModalDate);
  });
  saveState();
  closeTodayPlan();
  toast(`${dayDishes.length} 道菜全部完成 🎉`);
}

// === Detail Modal ===
function openDetail(id) {
  const d = state.dishes.find(x => x.id === id);
  if (!d) return;
  const photoHtml = d.photo ? `<img src="${d.photo}" style="width:100%;border-radius:8px;margin-bottom:12px;">` : '';
  const ingHtml = (d.ingredients && d.ingredients.length > 0) ? `
    <div class="detail-recipe">
      <h3>📦 食材清单</h3>
      <pre>${d.ingredients.map(i => `· ${i.name} ${i.qty}${i.unit}`).join('\n')}</pre>
    </div>
  ` : '';
  const recipeHtml = d.recipe ? `
    <div class="detail-recipe">
      <h3>📖 做法</h3>
      <pre>${escape(d.recipe)}</pre>
    </div>
  ` : '';
  document.getElementById('detailTitle').textContent = d.name;
  document.getElementById('detailBody').innerHTML = `
    ${photoHtml}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
      <span style="background:var(--bg-2);padding:4px 10px;border-radius:6px;font-size:12px;">⏱ ${d.time_min}min</span>
      <span style="background:var(--bg-2);padding:4px 10px;border-radius:6px;font-size:12px;">× ${d.made_count}次</span>
      <span style="background:var(--bg-2);padding:4px 10px;border-radius:6px;font-size:12px;">${lastMadeLabel(d.last_made)}</span>
      ${avgR(d) ? `<span style="background:var(--accent);color:var(--accent-on);padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;">★ ${avgR(d).toFixed(1)}</span>` : ''}
    </div>
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">
      板栗 ${starText(d.ratings?.banli)} · 妞妞 ${starText(d.ratings?.niuniu)} · 老婆 ${starText(d.ratings?.wife)}
    </div>
    ${ingHtml}
    ${recipeHtml}
    <div style="margin-top:14px;">
      <div class="adjust-row">
        <button class="plus" onclick="detailAdjust('${d.id}',1)">+1</button>
        <button class="plus" onclick="detailAdjust('${d.id}',3)">+3</button>
        <button onclick="detailAdjust('${d.id}',-1)">-1</button>
        <button onclick="detailAdjust('${d.id}',-3)">-3</button>
        <button onclick="detailReset('${d.id}')">清零</button>
      </div>
      <div style="margin-top:8px;display:flex;gap:6px;">
        <button class="btn btn-ghost" onclick="detailAddCart('${d.id}')" style="flex:1;">🛒 加入购物车</button>
        <button class="btn btn-primary" onclick="openDatePickerDirect('${d.id}')" style="flex:1;">📅 选日期加入</button>
      </div>
    </div>
  `;
  document.getElementById('detailBg').classList.add('show');
  document.getElementById('detailBg').dataset.id = id;
}

function detailAdjust(id, n) {
  const d = state.dishes.find(x => x.id === id);
  if (!d) return;
  d.made_count = Math.max(0, (d.made_count || 0) + n);
  if (n > 0) d.last_made = today;
  saveState();
  openDetail(id); // 刷新
}
function detailReset(id) {
  const d = state.dishes.find(x => x.id === id);
  if (!d) return;
  if (!confirm(`把 ${d.name} 计数清零？`)) return;
  d.made_count = 0; d.last_made = null;
  saveState();
  openDetail(id);
}
function detailAddCart(id) {
  // 直接加到明天
  addToCart(id, daysFromNow(1));
  closeDetail();
}
function openDatePickerDirect(id) {
  // 用 modal 中心弹一个居中的日期选择器
  closeDetail();
  const popup = document.getElementById('datePickerPopup');
  popup.innerHTML = `
    <div style="font-size:12px;color:var(--text-dim);padding:4px 14px;">加入哪天的菜单？</div>
  `;
  [1, 2, 3].forEach(n => {
    const date = daysFromNow(n);
    const btn = document.createElement('button');
    btn.innerHTML = `${labelForDays(n)} <small>${fmtDate(date)} ${weekdayName(date)}</small>`;
    btn.onclick = () => { addToCart(id, date); popup.style.display = 'none'; };
    popup.appendChild(btn);
  });
  popup.style.display = 'block';
  popup.style.top = '40%';
  popup.style.left = '50%';
  popup.style.transform = 'translate(-50%, -50%)';
  setTimeout(() => {
    document.addEventListener('click', e => {
      if (popup && !popup.contains(e.target)) { popup.style.display = 'none'; popup.style.transform = ''; }
    }, { once: true });
  }, 100);
}

function editFromDetail() {
  const id = document.getElementById('detailBg').dataset.id;
  closeDetail();
  openEditModal(id);
}

function starText(v) { if (!v) return '未评'; return '★'.repeat(v) + '☆'.repeat(5-v); }
function closeDetail() { document.getElementById('detailBg').classList.remove('show'); }
document.getElementById('detailBg').addEventListener('click', e => { if (e.target.id === 'detailBg') closeDetail(); });

// === Toast ===
let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// === Backup ===
window.exportData = function() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `breakfast-menu-${today}-v${DATA_VERSION}.json`;
  a.click();
  toast('已导出 JSON');
};
window.importData = function() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.version !== DATA_VERSION) { toast('版本不匹配', 'err'); return; }
        if (!confirm(`将覆盖现有 ${state.dishes.length} 道菜,导入 ${data.dishes.length} 道菜,继续？`)) return;
        state = data;
        state.dishes.forEach(x => { x.ingredients = x.ingredients || []; x.planned_for = x.planned_for || []; });
        if (!state.cart) state.cart = {};
        saveState();
        toast('已导入 ✅');
      } catch (err) { toast('解析失败', 'err'); }
    };
    reader.readAsText(f);
  };
  input.click();
};

render();
</script>
</body>
</html>
